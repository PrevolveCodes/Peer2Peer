<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>P2P Beta</title><link rel="stylesheet" href="style.css"></head><body class="dark-theme">
<audio id="ping-sound" src="https://assets.mixkit.co/active_storage/sfx/2357/2357-84.wav" preload="auto"></audio><div class="discord-wrapper">
<div id="auth-card" class="card center-card"><h1 class="brand-title">P2P BETA 1.0</h1><h3 id="auth-title">Create an Account</h3><div class="input-group"><label>Email</label><input type="email" id="auth-email" placeholder="you@example.com"></div><div class="input-group"><label>Username</label><input type="text" id="auth-username" placeholder="Alex"></div><div class="input-group"><label>Password</label><input type="password" id="auth-password" placeholder="At least 6 characters"></div><button id="auth-submit-btn" class="btn-primary">Sign Up</button><button id="auth-switch-btn" class="btn-text">Already have an account? Log In</button></div>
<div id="app-layout" class="discord-layout hidden"><aside class="discord-sidebar"><div class="sidebar-header"><h2>Rooms</h2><button id="theme-toggle" class="btn-icon-svg"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2A10 10 0 0 0 2 12a10 10 0 0 0 10 10a10 10 0 0 0 10-10A10 10 0 0 0 12 2m0 2a8 8 0 0 1 8 8a8 8 0 0 1-8 8V4Z"/></svg></button></div><div id="room-menu-list" class="room-list-container"></div><div class="sidebar-actions"><input id="sidebar-room-code" placeholder="Join Code" maxlength="6"><div class="action-buttons"><button id="join-room-btn" class="btn-small">Join Room</button><button id="create-room-btn" class="btn-small btn-primary">Create Room</button></div></div><div class="sidebar-footer"><div class="user-info"><div class="avatar-wrapper"><img id="user-display-pfp" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23949ba4'><circle cx='12' cy='8' r='3'/><path d='M5 20c1-5 13-5 14 0'/></svg>" alt="pfp"><span class="status-dot"></span></div><div class="user-meta-block"><strong id="user-display-name">...</strong><span id="user-custom-status" class="custom-status-text"></span></div></div><button id="profile-nav-btn" class="btn-icon-svg" title="User Settings"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8a4 4 0 0 0 0-8m9 4a7 7 0 0 0-.1-1.2l2-1.5l-2-3.4l-2.4 1a8 8 0 0 0-2-1.1L16 3h-4l-.5 2.8a8 8 0 0 0-2 1.1l-2.4-1l-2 3.4l2 1.5A7 7 0 0 0 5 12a7 7 0 0 0 .1 1.2l-2 1.5l2 3.4l2.4-1a8 8 0 0 0 2 1.1L12 21h4l.5-2.8a8 8 0 0 0 2-1.1l2.4 1l2-3.4l-2-1.5c.1-.4.1-.8.1-1.2"/></svg></button></div></aside>
<main class="discord-main"><div class="mobile-nav-header"><button class="mobile-menu-btn" id="mobile-hamburger-btn"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button><div class="mobile-room-title">Channels & Options</div></div><div class="mobile-sidebar-backdrop" id="sidebar-backdrop"></div><div id="alert-banner" class="alert hidden"></div>
<div id="profile-card" class="card center-card hidden"><h3>User Settings</h3><hr><div class="input-group"><label>Avatar</label><div class="pfp-edit-row"><img id="edit-pfp-preview" src=""><input type="file" id="edit-pfp-file" accept="image/*" class="file-hidden"><button class="btn-small" onclick="document.getElementById('edit-pfp-file').click()">Change Avatar</button></div></div><div class="input-group"><label>Username</label><input id="edit-username-input"></div><div class="input-group"><label>Pronouns</label><input id="edit-pronouns-input"></div><div class="input-group"><label>Status</label><input id="edit-status-input"></div><div class="input-group"><label>About Me</label><textarea id="edit-aboutme-input"></textarea></div><div class="input-group"><label>Profile Themes</label><input type="color" id="edit-banner-color-input" value="#5865f2"><input type="color" id="edit-color-input" value="#ffffff"></div><button id="save-profile-btn" class="btn-primary">Save Changes</button><button id="close-profile-btn" class="btn-secondary">Close Settings</button><button id="logout-btn" class="btn-text danger-text">Log Out Account</button></div>
<div id="room-settings-card" class="card center-card hidden"><h3>Room Settings</h3><hr><div class="input-group"><label>Room Display Name</label><input id="edit-room-name-input"></div><div class="input-group"><label>Room Icon</label><div class="pfp-edit-row"><img id="edit-room-icon-preview"><input type="file" id="edit-room-icon-file" accept="image/*" class="file-hidden"><button class="btn-small" onclick="document.getElementById('edit-room-icon-file').click()">Select Icon</button></div></div><button id="save-room-settings-btn" class="btn-primary">Save Changes</button><button id="close-room-settings-btn" class="btn-secondary">Cancel</button></div>
<div id="welcome-view" class="empty-state"><div class="empty-icon-svg"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></div><h2>Welcome to P2P BETA V 1.0</h2><p>Select a room or use P2P Social to message friends.</p></div>
<div id="room-view" class="active-chat-pane hidden"><div class="chat-header"><div class="chat-title-info"><img id="active-room-avatar" class="room-avatar-header hidden"><span id="active-room-hashtag" class="hashtag">#</span><span id="active-room-title">------</span></div><div class="header-actions"><button id="room-settings-btn" class="btn-small">Room Settings</button><button id="view-pins-btn" class="btn-small">Pins (<span id="pin-count">0</span>)</button><button id="copy-btn" class="btn-small">Copy Room Code</button><button id="remove-room-btn" class="btn-small danger-outline">Remove From List</button></div></div><div id="pins-drawer" class="pins-dropdown hidden"><h4>Pinned Chat Content</h4><div id="pins-list-box"></div></div><div id="reply-context-bar" class="reply-context hidden"><span id="reply-context-text"></span><button id="cancel-reply-btn" class="btn-text-close">✕</button></div><div id="chat-box"></div><div id="typing-indicator"></div><div class="chat-input-area"><div class="input-container-wrapper"><button id="media-attach-btn" class="btn-attach">+</button><input type="file" id="hidden-media-input" accept="image/*,video/*,audio/*" class="file-hidden"><textarea id="message-input" placeholder="Message room..." rows="1"></textarea><button id="send-btn" class="btn-primary">Send</button></div></div></div>
</main></div></div>
<div id="user-inspect-modal" class="modal-overlay hidden"><div class="inspect-card"><div class="inspect-header-banner"></div><div class="inspect-avatar-row"><img id="inspect-pfp"></div><div class="inspect-body"><h3 id="inspect-username">...</h3><div class="inspect-section"><label>Custom Status</label><p id="inspect-status">None</p></div><button id="close-inspect-btn" class="btn-secondary btn-full">Close Profile</button></div></div></div>
<script type="module" src="social.js"></script><script type="module" src="app.js"></script><script type="module" src="room-controls.js"></script><script type="module" src="profile-customization.js"></script>
</body></html>
