<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>Peer2Peer</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ui-join-button-fix.css">
<link rel="stylesheet" href="mobile.css">
<link rel="stylesheet" href="hover-buttons-fix.css">
<style>
.friend-row{display:flex;align-items:center;gap:4px;width:100%}.friend-row>.list-item{flex:1;min-width:0}.remove-friend-button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:7px;padding:7px 8px;cursor:pointer;white-space:nowrap}.remove-friend-button:hover{color:#ff6b6b;border-color:#ff6b6b}.message-actions [data-fix-delete]{color:#ff6b6b}
.image-upload-button{width:46px!important;height:46px;flex:none;padding:0!important;border:1px solid var(--line)!important;border-radius:50%!important;background:var(--panel2)!important;color:var(--muted)!important;display:grid;place-items:center;font-size:22px!important}.image-upload-button:hover{background:var(--input)!important;color:var(--text)!important;border-color:var(--accent)!important}.image-upload-button:disabled{opacity:.6;cursor:wait}.message-image{display:block;max-width:min(520px,80vw);max-height:420px;width:auto;height:auto;border-radius:10px;margin-top:5px;object-fit:contain;cursor:pointer;border:1px solid var(--line)}
</style>
</head>
<body>
<div id="auth" class="auth"><div class="auth-card"><div class="logo">P2P</div><h1>Peer2Peer</h1><p id="auth-sub">Create your account</p><input id="email" type="email" placeholder="Email" autocomplete="email"><input id="username" placeholder="Username" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="auth-btn">Create account</button><button id="auth-switch" class="link">Already have an account? Log in</button><div id="auth-error"></div></div></div>
<input id="mobile-nav-toggle" class="mobile-nav-toggle" type="checkbox" aria-label="Toggle navigation">
<label for="mobile-nav-toggle" class="mobile-menu-button" aria-label="Open navigation">☰</label>
<label for="mobile-nav-toggle" class="mobile-nav-overlay" aria-hidden="true"></label>
<div id="app" class="app hidden"><aside class="sidebar"><div class="brand"><span>P2P</span><button id="theme">◐</button></div><button id="new-dm" class="add-friend-button">Add Friend</button><div class="section-title">MESSAGES</div><div id="dm-list" class="list"></div><div class="section-title">ROOMS <button id="new-group">+</button></div><div id="room-list" class="list"></div><div class="room-actions"><input id="room-code" placeholder="Room code or invite code"><button id="join-room">Join</button></div><div class="me" id="profile-open"><img id="me-avatar"><div><b id="me-name">User</b><small id="me-status">Online</small></div><button type="button">⚙</button></div></aside><main class="main"><header><div><b id="view-title">Welcome</b><small id="view-sub">Private conversations and rooms</small></div><div id="header-actions"></div></header><div id="content" class="content"><div class="welcome"><div class="big-logo">P2P</div><h2>Peer2Peer</h2><p>Choose a conversation, join a room, or find someone to message.</p></div></div></main></div>
<button id="create-room" hidden aria-hidden="true"></button><div id="modal-root"></div>
<script type="module" src="app.js"></script><script type="module" src="emoji-picker.js"></script><script type="module" src="room-settings-fix.js"></script><script type="module" src="auth-fix.js"></script><script type="module" src="ui-sidebar-people.js"></script><script type="module" src="friend-message-actions.js"></script><script type="module" src="image-upload.js"></script><script type="module" src="message-grouping.js"></script>
</body></html>
