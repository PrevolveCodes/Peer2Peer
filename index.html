<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peer2Peer</title><link rel="stylesheet" href="style.css"></head><body>
<div id="auth" class="auth"><div class="auth-card"><div class="logo">P2P</div><h1>Peer2Peer</h1><p id="auth-sub">Create your account</p><input id="email" type="email" placeholder="Email"><input id="username" placeholder="Username"><input id="password" type="password" placeholder="Password"><button id="auth-btn">Create account</button><button id="auth-switch" class="link">Already have an account? Log in</button><div id="auth-error"></div></div></div>
<div id="app" class="app hidden"><aside class="sidebar"><div class="brand"><span>P2P</span><button id="theme">◐</button></div><div class="section-title">MESSAGES <button id="new-dm">+</button></div><div id="dm-list" class="list"></div><div class="section-title">GROUPS <button id="new-group">+</button></div><div id="group-list" class="list"></div><div class="section-title">ROOMS</div><div id="room-list" class="list"></div><div class="room-actions"><input id="room-code" placeholder="Room code"><button id="join-room">Join</button><button id="create-room">New room</button></div><div class="me" id="profile-open"><img id="me-avatar"><div><b id="me-name">User</b><small id="me-status">Online</small></div><button>⚙</button></div></aside><main class="main"><header><div><b id="view-title">Welcome</b><small id="view-sub">Private conversations and rooms</small></div><div id="header-actions"><button id="group-settings-top" class="group-settings-btn hidden" title="Group settings" aria-label="Group settings">⚙</button></div></header><div id="content" class="content"><div class="welcome"><div class="big-logo">P2P</div><h2>Peer2Peer</h2><p>Choose a conversation, join a room, or find someone to message.</p></div></div></main></div>
<div id="modal-root"></div><script type="module" src="app.js"></script></body></html>
